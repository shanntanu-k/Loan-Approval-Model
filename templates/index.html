<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Loan Approval Predictor</h1>
        <p class="subtitle">Enter applicant details to estimate approval probability.</p>

        <form id="predictForm" novalidate>
            <label for="income">Income</label>
            <input id="income" type="number" step="any" min="0" max="1000000" name="Income" required>

            <label for="credit">Credit Score</label>
            <input id="credit" type="number" step="1" min="300" max="900" name="Credit_Score" required>

            <label for="loan">Loan Amount</label>
            <input id="loan" type="number" step="any" min="0" max="2000000" name="Loan_Amount" required>

            <label for="dti">DTI Ratio (%)</label>
            <input id="dti" type="number" step="any" min="0" max="100" name="DTI_Ratio" required>

            <label for="status">Employment Status</label>
            <select id="status" name="Employment_Status" required>
                <option value="employed">Employed</option>
                <option value="unemployed">Unemployed</option>
            </select>

            <button type="submit">Predict</button>
        </form>

        <p id="inlineError" class="inline-error" aria-live="polite"></p>
    </div>

    <div class="popup-overlay" id="popupOverlay" role="dialog" aria-modal="true" aria-labelledby="popupText">
        <div class="popup">
            <h3 id="popupText"></h3>
            <button type="button" id="closePopup">OK</button>
        </div>
    </div>

    <script>
        const form = document.getElementById("predictForm");
        const popupOverlay = document.getElementById("popupOverlay");
        const popupText = document.getElementById("popupText");
        const closePopupButton = document.getElementById("closePopup");
        const inlineError = document.getElementById("inlineError");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            inlineError.textContent = "";

            const payload = Object.fromEntries(new FormData(form).entries());

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (!response.ok || !data.ok) {
                    const errors = data.errors ? data.errors.join(" ") : "Unable to process prediction.";
                    inlineError.textContent = errors;
                    return;
                }

                popupText.textContent = data.message;
                popupOverlay.style.display = "flex";
            } catch (error) {
                inlineError.textContent = "Server error. Please try again.";
            }
        });

        closePopupButton.addEventListener("click", function () {
            popupOverlay.style.display = "none";
        });
    </script>
</body>
</html>
